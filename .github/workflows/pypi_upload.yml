name: Publish to PyPI

on:
  workflow_run:
    workflows: ['Estimator tests']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify the completed workflow and exact main revision
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          repo, repo_id = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_REPOSITORY_ID']
          def same(value):
              return value.get('full_name', '').lower() == repo.lower() and str(value.get('id')) == repo_id
          def require(condition, message):
              if not condition:
                  raise SystemExit('Release blocked: ' + message)
          def api(path):
              request = Request('https://api.github.com/repos/' + repo + path,
                                headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                         'Accept': 'application/vnd.github+json',
                                         'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = api('/actions/runs/' + str(event['workflow_run']['id']))
          sha = run['head_sha']
          require(same(event['repository']) and same(run['repository']) and same(run['head_repository']), 'wrong source repository')
          require(run['name'] == 'Estimator tests' and run['path'].split('@')[0] == '.github/workflows/tests.yml', 'wrong workflow')
          require(run['event'] == 'push' and run['head_branch'] == 'main', 'a main push is required')
          require(run['status'] == 'completed' and run['conclusion'] == 'success', 'tests have not succeeded')
          require(re.fullmatch('[0-9a-f]{40}', sha) and sha == event['workflow_run']['head_sha'], 'wrong tested SHA')
          suite = api('/check-suites/' + str(run['check_suite_id']))
          require(suite['app']['id'] == 15368 and suite['app']['slug'] == 'github-actions', 'untrusted check source app')
          require(suite['head_sha'] == sha and suite['conclusion'] == 'success', 'wrong or unsuccessful test suite')
          ready = api('/branches/main')['commit']['sha'] == sha
          message = ('Verified successful same-repository main-push Estimator tests at ' + sha
                     if ready else 'Skipped: tested commit is no longer the main head.')
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(message + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('ready=' + str(ready).lower() + '\nsha=' + sha + '\n')
          PY

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Python dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.8'
          cache: pip
      - run: python -m pip install -r requirements.txt wheel
      - name: Build the tested package
        run: python setup.py sdist bdist_wheel
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USER }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload --skip-existing dist/*
