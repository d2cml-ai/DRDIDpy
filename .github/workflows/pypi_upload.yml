name: Publish to PyPI

on:
  workflow_run:
    workflows: ['Estimator tests']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-drdid
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify all four checks on the exact main revision
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_ci.py

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build the tested package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pypi-${{ needs.gate.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/drdid
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pypi-${{ needs.gate.outputs.sha }}
          path: dist/
      - name: Verify any files already published for this version
        run: python3 scripts/check_release_ci.py --artifacts dist
      # The upload action adds attestation sidecars to dist/. Keep the exact
      # candidate distributions separate for the strict public readback check.
      - name: Preserve tested artifacts for publication readback
        run: |
          mkdir publication-candidate
          cp dist/*.whl dist/*.tar.gz publication-candidate/
      # Recheck after the build or any environment delay, immediately before
      # uploading. A stale revision or newer unfinished CI attempt must wait.
      - name: Recheck tested main before publishing
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: python3 scripts/check_release_ci.py
      - name: Publish using PyPI Trusted Publishing
        if: steps.verify.outputs.ready == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
      - name: Confirm the complete release is publicly available
        if: steps.verify.outputs.ready == 'true'
        run: python3 scripts/check_release_ci.py --verify-publication publication-candidate
